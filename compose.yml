name: polythought

services:
  polythought:
    image: ${POLYTHOUGHT_IMAGE:-ghcr.io/extrange/polythought:latest}
    restart: always
    container_name: polythought
    init: true
    environment:
      API_HASH: "${API_HASH:?API_HASH is required}"
      API_ID: "${API_ID:?API_ID is required}"
      BOT_TOKEN: "${BOT_TOKEN:?BOT_TOKEN is required}"
      BROWSERLESS_TOKEN: "${BROWSERLESS_TOKEN:?BROWSERLESS_TOKEN is required}"
      # Deployment-specific settings, kept here so .env only holds secrets.
      CHANNEL_ID: "-1002079983177"
      MY_CHAT_ID: "427380463"
      SESSION_FILE: /app/credentials/prod_account.session
    volumes:
      - ./db:/app/db
      - ./credentials:/app/credentials
    networks:
      - polythought

networks:
  polythought:
