name: polythought

services:
  polythought:
    image: ${POLYTHOUGHT_IMAGE:-ghcr.io/extrange/polythought:latest}
    restart: always
    container_name: polythought
    init: true
    depends_on:
      polythought-camofox:
        condition: service_healthy
    environment:
      API_HASH: "${API_HASH:?API_HASH is required}"
      API_ID: "${API_ID:?API_ID is required}"
      BOT_TOKEN: "${BOT_TOKEN:?BOT_TOKEN is required}"
      # Deployment-specific settings, kept here so .env only holds secrets.
      CHANNEL_ID: "-1002079983177"
      MY_CHAT_ID: "427380463"
      SESSION_FILE: /app/credentials/prod_account.session
      CAMOFOX_URL: http://polythought-camofox:9377
    volumes:
      - ./db:/app/db
      - ./credentials:/app/credentials

  # Dedicated browser for resolving page titles. It is intentionally private to
  # this project: its own volume, session state, and network.
  polythought-camofox:
    image: ghcr.io/jo-inc/camofox-browser@sha256:49f8e02f9fb0e191b406845482745efc72f835db06789e3a34e77a6ff1497046
    restart: always
    container_name: polythought-camofox
    init: true
    shm_size: 2G
    volumes:
      - ./data/camofox:/root/.camofox
    networks:
      - polythought
    environment:
      MAX_OLD_SPACE_SIZE: 2048
      CAMOFOX_CRASH_REPORT_ENABLED: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9377/health"]
      start_period: 30s
