name: polythought

services:
  polythought:
    image: ghcr.io/extrange/polythought:latest
    restart: always
    container_name: polythought
    init: true
    volumes:
      - ./db:/app/db
      - ./credentials:/app/credentials
    networks:
      - polythought
    env_file:
      - path: env/prod.env
        required: true
    environment:
      TZ: Asia/Singapore

networks:
  polythought:
