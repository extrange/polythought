[project]
name = "polythought"
version = "0.1.0"
description = "Telegram bot that collects links and shares them with a channel"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "playwright>=1.49.1",
    "playwright-stealth>=1.0.6",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "telethon>=1.38.1",
    "uvloop>=0.21.0",
]

[tool.uv]
package = true

[tool.pyright]
# pre-commit: make pyright use the venv
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.pytest.ini_options]
# https://docs.pytest.org/en/latest/explanation/goodpractices.html#which-import-mode
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
testpaths = ["tests"]


[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pyright>=1.1.391",
    "pytest>=8.3.4",
    "pytest-env>=1.1.5",
    "ruff>=0.8.4",
]
